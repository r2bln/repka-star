<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>repka-star</title>
<link rel="stylesheet" href="/pico.min.css">
<style>
  #status {
    position: sticky;
    top: 0.5rem;
    z-index: 10;
    padding: 0;
    min-height: 0;
    border-radius: var(--pico-border-radius);
    transition: padding 0.15s ease;
  }
  #status:not(:empty) {
    padding: 0.75rem 1rem;
    margin-bottom: 1rem;
    font-weight: bold;
  }
  #status.ok { background: #1d5e2a; color: #fff; }
  #status.error { background: #7a1f1f; color: #fff; }
  .service-state { font-weight: bold; }
  .service-state.ok { color: #2f9e44; }
  .service-state.error { color: #e03131; }

  .lamp {
    display: inline-block;
    width: 0.7rem;
    height: 0.7rem;
    border-radius: 50%;
    margin-left: 0.5rem;
    background: #868e96;
    vertical-align: middle;
  }
  .lamp.ok { background: #2f9e44; }
  .lamp.error { background: #e03131; }

  nav.tabs { display: flex; justify-content: flex-start; gap: 0.5rem; margin-bottom: 1rem; }
  nav.tabs button { width: auto; flex: 0 0 auto; }
  nav.tabs button.outline { --pico-color: var(--pico-muted-color); }

  pre.log {
    max-height: 60vh;
    overflow-y: auto;
    background: var(--pico-code-background-color);
    padding: 1rem;
    font-size: 0.8rem;
    white-space: pre-wrap;
    word-break: break-all;
  }
</style>
</head>
<body>
<main class="container">
  <h1>repka-star</h1>
  <p>Редактирование конфигов MMDVMHost / DMRGateway и перезапуск сервисов.</p>
  <nav class="tabs">
    <button type="button" data-tab="configs" id="tab-btn-configs">Конфиги</button>
    <button type="button" data-tab="logs" id="tab-btn-logs" class="outline">Логи</button>
  </nav>
  <div id="status"></div>
  <section id="view-configs">
    <div id="configs">Загрузка...</div>
  </section>
  <section id="view-logs" hidden>
    <div id="logs">Загрузка...</div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
